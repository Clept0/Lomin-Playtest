<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lomin · Playtest</title>
<style>html,body{height:100%;margin:0;background:#071714;color:#cddbcf;font:16px system-ui}body{display:grid;place-items:center}main{width:min(100%,1600px)}canvas{display:block;width:100%;aspect-ratio:16/9;background:#071714;outline:none}header{padding:14px 20px;display:flex;justify-content:space-between;align-items:center}b{font-weight:500;letter-spacing:.3em;color:#d3bb7b}button{background:transparent;border:1px solid #65745c;color:inherit;padding:8px 15px;cursor:pointer}#status{font-size:14px;white-space:pre-wrap;padding:0 20px 12px}progress{width:100%;height:3px;accent-color:#d3bb7b}footer{padding:12px 20px;color:#96b0a0;font-size:13px}</style></head>
<body><main><header><b>LOMIN</b><button id="fullscreen">Vollbild</button></header><div id="status">Lomin wird geladen …</div><progress id="progress" value="0" max="1"></progress><canvas id="unity-canvas" width="1600" height="900" tabindex="0" aria-label="Lomin Spiel"></canvas><footer>WASD · Leertaste springen · Shift Dash · J Schwert · E sprechen · Esc Menü / Koop / Debugkonsole<br>Controller verbinden und eine Taste drücken. Couch-Koop im Menü aktivieren. Spielstände bleiben in diesem Browser.</footer></main>
<script>
const canvas=document.querySelector('canvas'),status=document.querySelector('#status'),progress=document.querySelector('progress');
const config={dataUrl:'Build/Web.data.unityweb',frameworkUrl:'Build/Web.framework.js.unityweb',codeUrl:'Build/Web.wasm.unityweb',streamingAssetsUrl:'StreamingAssets',companyName:'DefaultCompany',productName:'Project_Lomin',productVersion:'0.1.0',devicePixelRatio:Math.min(window.devicePixelRatio||1,1.25),autoSyncPersistentDataPath:true,showBanner:(message,type)=>{if(type==='error')status.textContent=message;}};
const loader=document.createElement('script');loader.src='Build/Web.loader.js';loader.onload=()=>createUnityInstance(canvas,config,p=>progress.value=p).then(instance=>{window.lomin=instance;progress.hidden=true;status.textContent='Bereit – ins Spiel klicken. Esc öffnet das Menü.';canvas.focus();document.querySelector('#fullscreen').onclick=()=>instance.SetFullscreen(1);}).catch(error=>status.textContent='Start fehlgeschlagen: '+error);
loader.onerror=()=>status.textContent='Download fehlgeschlagen. Bitte Seite erneut laden.';document.body.appendChild(loader);canvas.addEventListener('pointerdown',()=>canvas.focus());
</script></body></html>
